<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amani Sign</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
:root{--void:#050608;--cyan:#22d3ee;--cyan-hi:#7fefff;--ink:#cfe9f0;--muted:#5b7a85;}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:
  radial-gradient(1200px 600px at 50% -10%, rgba(34,211,238,.10), transparent 60%),
  repeating-linear-gradient(0deg, rgba(34,211,238,.025) 0 1px, transparent 1px 3px), var(--void);
  color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;flex-direction:column;align-items:center;padding:28px 20px;}
.wordmark{font-family:"Anton","Arial Black",sans-serif;font-size:clamp(2rem,7vw,3rem);letter-spacing:.10em;
  text-transform:uppercase;color:transparent;-webkit-text-stroke:2px var(--cyan);
  text-shadow:0 0 8px var(--cyan),0 0 20px rgba(34,211,238,.6),0 0 44px rgba(34,211,238,.35);text-align:center;line-height:1}
.subtitle{text-align:center;color:var(--muted);letter-spacing:.30em;text-transform:uppercase;font-size:.72rem;margin-top:12px}
.stage{position:relative;width:640px;max-width:100%;margin-top:22px;border-radius:14px;overflow:hidden;
  border:1px solid rgba(34,211,238,.28);box-shadow:0 0 40px rgba(34,211,238,.12)}
#canvas{width:100%;display:block;transform:scaleX(-1);background:#000}
.readout{position:absolute;left:0;right:0;bottom:0;padding:14px 18px;
  background:linear-gradient(0deg,rgba(5,6,8,.92),transparent);display:flex;justify-content:space-between;align-items:flex-end}
.gesture{font-family:"Anton",sans-serif;font-size:2rem;color:var(--cyan-hi);text-shadow:0 0 16px rgba(34,211,238,.6);letter-spacing:.04em}
.fingers{font-size:.85rem;color:var(--muted);text-align:right}
button{margin-top:22px;padding:12px 26px;background:var(--cyan);color:#012026;font-weight:800;letter-spacing:.04em;
  border:none;border-radius:8px;cursor:pointer;text-transform:uppercase;font-size:.88rem;box-shadow:0 0 18px rgba(34,211,238,.45)}
button:hover{background:var(--cyan-hi);box-shadow:0 0 26px rgba(34,211,238,.7)}
.status{color:var(--muted);font-size:.85rem;margin-top:14px;text-align:center;max-width:520px}
.brandmark{text-align:center;margin-top:20px}
.brandmark .secured{font-size:.62rem;letter-spacing:.5em;text-transform:uppercase;color:#6fd8ec;text-shadow:0 0 6px rgba(34,211,238,.5)}
.brandmark .company{margin-top:5px;font-family:"Anton","Arial Black",sans-serif;font-size:1.05rem;letter-spacing:.12em;
  text-transform:uppercase;color:transparent;-webkit-text-stroke:1.2px var(--cyan);text-shadow:0 0 6px var(--cyan),0 0 16px rgba(34,211,238,.55)}
</style>
</head>
<body>
  <div class="wordmark">Amani Sign</div>
  <div class="subtitle">Hand Sign Recognition</div>

  <button id="start">Start camera</button>
  <p class="status" id="status">Click “Start camera” and allow access. First load fetches the hand-tracking model.</p>

  <div class="stage" id="stage" style="display:none">
    <canvas id="canvas" width="640" height="480"></canvas>
    <div class="readout">
      <div class="gesture" id="gesture">—</div>
      <div class="fingers" id="fingers"></div>
    </div>
  </div>

  <div class="brandmark">
    <div class="secured">Secured by</div>
    <div class="company">Impunga Yehlathi</div>
  </div>

<script type="module">
import {HandLandmarker, FilesetResolver, DrawingUtils}
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

const statusEl=document.getElementById('status');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const gestureEl=document.getElementById('gesture');
const fingersEl=document.getElementById('fingers');
let handLandmarker, video, running=false, drawer;

async function setup(){
  statusEl.textContent="Loading hand-tracking model…";
  const fileset=await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
  handLandmarker=await HandLandmarker.createFromOptions(fileset,{
    baseOptions:{modelAssetPath:
      "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"},
    numHands:1, runningMode:"VIDEO"});
  drawer=new DrawingUtils(ctx);
}

function dist(a,b){const dx=a.x-b.x,dy=a.y-b.y,dz=(a.z||0)-(b.z||0);return Math.sqrt(dx*dx+dy*dy+dz*dz);}

// A finger is "extended" if its tip is farther from the wrist than its lower joint.
function fingerStates(lm){
  const wrist=lm[0];
  const pairs=[[4,2],[8,6],[12,10],[16,14],[20,18]]; // [tip, lowerJoint] per finger
  return pairs.map(([tip,low])=>dist(lm[tip],wrist)>dist(lm[low],wrist)?1:0);
}

function classify(s){
  const [t,i,m,r,p]=s;
  const count=s.reduce((a,b)=>a+b,0);
  if(count===0) return "Fist";
  if(count===5) return "Open palm";
  if(t&&!i&&!m&&!r&&!p) return "Thumbs up";
  if(!t&&i&&!m&&!r&&!p) return "Pointing";
  if(!t&&i&&m&&!r&&!p) return "Peace";
  if(!t&&i&&m&&r&&p) return "Four";
  if(t&&i&&!m&&!r&&p) return "I love you";
  return count+" fingers";
}

async function loop(){
  if(!running) return;
  if(video.readyState>=2){
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
    const res=handLandmarker.detectForVideo(video, performance.now());
    if(res.landmarks && res.landmarks.length){
      const lm=res.landmarks[0];
      drawer.drawConnectors(lm, HandLandmarker.HAND_CONNECTIONS, {color:"#22d3ee", lineWidth:3});
      drawer.drawLandmarks(lm, {color:"#7fefff", radius:4});
      const states=fingerStates(lm);
      gestureEl.textContent=classify(states);
      fingersEl.innerHTML="thumb·index·middle·ring·pinky<br>"+
        states.map(x=>x?"●":"○").join(" ");
    } else {
      gestureEl.textContent="—";
      fingersEl.textContent="no hand detected";
    }
  }
  requestAnimationFrame(loop);
}

document.getElementById('start').addEventListener('click', async ()=>{
  try{
    if(!handLandmarker) await setup();
    statusEl.textContent="Requesting camera…";
    const stream=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480}});
    video=document.createElement('video');
    video.srcObject=stream; video.playsInline=true; await video.play();
    document.getElementById('stage').style.display="block";
    document.getElementById('start').style.display="none";
    statusEl.textContent="Show your hand to the camera. Try a fist, open palm, peace, or thumbs up.";
    running=true; loop();
  }catch(e){
    statusEl.textContent="Couldn't start: "+e.message+" (use Chrome/Edge over http://localhost or a file, and allow the camera).";
  }
});
</script>
</body>
</html>
