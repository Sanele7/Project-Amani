<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Amani Test{% endblock %}</title>
  <!-- Neon display face; falls back to a heavy system font if offline -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% block body %}{% endblock %}

  {% block brandmark %}
  <div class="brandmark">
    <div class="secured">Secured by</div>
    <div class="company">Impunga Yehlathi</div>
  </div>
  {% endblock %}
</body>
</html>
